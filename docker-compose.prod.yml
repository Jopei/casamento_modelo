# Publicacao. Diferencas para o docker-compose.yml de desenvolvimento:
#   - o site vai compilado dentro da imagem do nginx (sem servidor Vite)
#   - site e API na mesma origem, entao nao ha porta 5174 nem CORS
#   - o codigo do backend e copiado, nao montado do disco
#   - senhas vem do arquivo .env ao lado deste
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casamento_backend_prod
    restart: always
    env_file: ./backend/.env
    volumes:
      # Somente o que precisa sobreviver a um novo deploy.
      - storage_app:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casamento-network

  # Termina o HTTPS e repassa para o nginx. Emite e renova o certificado
  # da Let's Encrypt sozinho.
  caddy:
    image: caddy:2-alpine
    container_name: casamento_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?defina SITE_DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Guarda os certificados: sem isso, cada deploy pede um novo e a
      # Let's Encrypt bloqueia por excesso de pedidos.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - web
    networks:
      - casamento-network

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: casamento_nginx_prod
    restart: always
    # Sem porta publicada: so o Caddy fala com o nginx, pela rede interna.
    expose:
      - "80"
    volumes:
      # O nginx serve /storage direto do disco, sem passar pelo PHP.
      - storage_app:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - casamento-network

  db:
    image: mysql:8.0
    container_name: casamento_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_DATABASE:-casamento}
      MYSQL_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - casamento-network

networks:
  casamento-network:

volumes:
  db_data_prod:
  storage_app:
  storage_logs:
  caddy_data:
  caddy_config:
  caddy_logs:
