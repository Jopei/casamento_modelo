server {
    listen 80;
    server_name _;

    # Fotos do casamento chegam do celular com varios MB; casa com os
    # limites de backend/docker/php.ini.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API do Laravel ------------------------------------------------
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # ---- Imagens enviadas pelo admin -----------------------------------
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 120;
    }

    # ---- Site (SPA) ----------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca pode ser cacheado, senao um deploy novo nao chega
    # ao navegador de quem ja visitou o site.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rotas do React Router (/presentes, /rsvp, ...) precisam cair no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
