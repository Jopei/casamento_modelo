; O app aceita imagens de ate 10 MB (regra 'image', 'max:10240' nos
; FormRequests). Os padroes do PHP sao 2M/8M, o que faz o upload chegar
; vazio ao Laravel e virar um erro de validacao confuso. Estes valores
; deixam folga para varias fotos de celular no mesmo envio.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_file_uploads = 20
max_execution_time = 120
