<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monograma do casal. Cores do site: marrom, dourado e champagne. -->
  <rect width="64" height="64" rx="14" fill="#6b5b45"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#b8975a" stroke-width="1.5"/>
  <!-- Serif do sistema: fontes web nao carregam dentro de favicon. -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="30"
        font-style="italic" fill="#f2e8d9">
    E<tspan fill="#b8975a">&amp;</tspan>J
  </text>
</svg>
